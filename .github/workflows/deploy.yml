name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Verify sitemap generated
        run: |
          if [ ! -f build/sitemap.xml ]; then
            echo "ERROR: sitemap.xml not found in build output"
            exit 1
          fi
          URL_COUNT=$(grep -o "<loc>" build/sitemap.xml | wc -l)
          echo "sitemap.xml OK — $URL_COUNT URLs"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./build
          # user_name: github-actions[bot]
          # user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Ping Google sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://jwher.github.io/sitemap.xml" -o /dev/null -w "%{http_code}" | grep -q "200\|301" && echo "Google pinged OK" || echo "Google ping skipped (non-blocking)"
