name: Update GA4 Views

on:
  schedule:
    # 매월 1일 00:00 UTC (한국 09:00)
    - cron: '0 0 1 * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy.yml 과 동일 브랜치 (main 에서 빌드·배포 트리거)
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GA4 views
        run: node scripts/fetch-ga-views.js
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_KEY: ${{ secrets.GA_SERVICE_ACCOUNT_KEY }}

      - name: Commit updated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ga-views.ts
          git diff --staged --quiet || git commit -m "chore: update GA4 views data (monthly)"
          git push
